<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryVid - Audio = Subtitles Sync</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0F0F14;color:white}.card{background:#1A1A22;border:1px solid #2A2A35}.purple{background:#8B5CF6}</style>
</head>
<body class="p-3 max-w-xl mx-auto">
<h1 class="text-xl font-bold text-center mt-3">StoryVid - Voice = Subtitles</h1>

<div class="card p-3 rounded-xl mt-3">
<textarea id="script" class="w-full p-3 rounded bg-black border border-gray-700 h-32 text-sm">But what Amara didn't know was that the rich man who had just visited her market was about to change her life forever. In Freetown, she sold groundnut every day to feed her family. That morning, the man returned and said your honesty yesterday touched my heart. I want to sponsor your children to school. Amara cried tears of joy. Her story proves honesty still opens big doors in Sierra Leone.</textarea>
<button onclick="autoSplit()" class="w-full mt-2 card p-2 rounded text-xs">✂️ Auto-split story into images</button>
</div>

<div class="card p-3 rounded-xl mt-3">
<p class="font-bold text-sm">📸 UPLOAD IMAGES (Tap)</p>
<input type="file" id="files" multiple accept="image/*" class="mt-2">
<div id="preview" class="grid grid-cols-1 gap-2 mt-3"></div>
</div>

<div class="card p-3 rounded-xl mt-3">
<canvas id="canvas" width="720" height="1280" class="w-full rounded-xl bg-black" style="max-width:360px;margin:auto;display:block"></canvas>
<div id="sub" class="text-center mt-2 p-3 bg-black rounded-xl font-bold text-yellow-300 text-[18px] leading-tight min-h-[80px]">Subtitles will show here - Same as audio</div>
<button onclick="playAll()" class="w-full purple mt-3 p-4 rounded-xl font-bold">▶ PLAY - Audio Will Match Subtitles Exactly</button>
<button onclick="stopAll()" class="w-full card mt-2 p-3 rounded-xl">Stop</button>
<button onclick="record()" class="w-full bg-green-600 mt-2 p-3 rounded-xl font-bold">⬇ Record & Download Video</button>
</div>

<script>
let images=[]; let idx=0; let playing=false;
document.getElementById('files').addEventListener('change', e=>{
 for(let f of e.target.files){
  let r=new FileReader(); r.onload=ev=>{images.push({src:ev.target.result, text:''}); render();}; r.readAsDataURL(f);
 }
});
function autoSplit(){
 let s=document.getElementById('script').value.split(/[.!?]+/).filter(x=>x.trim().length>5);
 if(images.length==0){alert('Upload images first'); return;}
 s.forEach((txt,i)=>{ if(images[i]) images[i].text=txt.trim()+'.'; });
 render();
}
function render(){
 let p=document.getElementById('preview'); p.innerHTML='';
 images.forEach((im,i)=>{
  p.innerHTML+=`<div class="flex gap-2 card p-2 rounded"><img src="${im.src}" class="w-20 h-20 object-cover rounded"><div class="flex-1"><p class="text-xs text-gray-400">Image ${i+1} - This text = audio = subtitle</p><textarea oninput="images[${i}].text=this.value" class="w-full text-sm p-2 bg-black border border-gray-700 rounded mt-1" rows="3">${im.text}</textarea></div></div>`;
 });
}
let canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), sub=document.getElementById('sub');
function draw(i, scale=1){
 let img=new Image(); img.src=images[i].src;
 img.onload=()=>{
  ctx.clearRect(0,0,720,1280);
  let sc=Math.max(720/img.width,1280/img.height)*scale;
  let w=img.width*sc, h=img.height*sc;
  ctx.drawImage(img,(720-w)/2,(1280-h)/2,w,h);
  // draw subtitle on canvas too
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,980,720,300);
  ctx.fillStyle='yellow'; ctx.strokeStyle='black'; ctx.lineWidth=5; ctx.font='bold 36px sans-serif'; ctx.textAlign='center';
  let words=images[i].text.match(/.{1,35}(\s|$)/g)||[images[i].text];
  words.forEach((l,j)=>{ let y=1050+j*45; ctx.strokeText(l.trim(),360,y); ctx.fillText(l.trim(),360,y); });
 };
}

function playAll(){
 if(images.length==0){alert('Upload images'); return;}
 playing=true; idx=0; speak();
}
function speak(){
 if(!playing || idx>=images.length){playing=false; sub.innerText='Finished'; return;}
 let txt=images[idx].text;
 if(!txt){idx++; speak(); return;}
 sub.innerText=txt;
 draw(idx,1);
 // TALKING EFFECT - zoom pulse
 let pulse=setInterval(()=>{draw(idx, 1+Math.random()*0.08)},120);
 let u=new SpeechSynthesisUtterance(txt);
 u.rate=0.9;
 u.onend=()=>{clearInterval(pulse); idx++; setTimeout(speak,400);};
 // Word-by-word highlight in subtitle box
 u.onboundary=e=>{
  if(e.name==='word'){
   let spoken=txt.substring(0,e.charIndex+e.charLength);
   sub.innerHTML=spoken+'<span class="bg-yellow-400 text-black">'+txt.substring(e.charIndex,e.charIndex+e.charLength)+'</span>'+txt.substring(e.charIndex+e.charLength);
  }
 };
 speechSynthesis.speak(u);
}
function stopAll(){playing=false; speechSynthesis.cancel();}

function record(){
 let stream=canvas.captureStream(30);
 let rec=new MediaRecorder(stream,{mimeType:'video/webm'}); let chunks=[];
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{let b=new Blob(chunks,{type:'video/webm'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='StoryVid-Subtitles-Match-Audio.webm'; a.click();};
 rec.start(); playAll();
 setTimeout(()=>{rec.stop(); stopAll();}, images.length*7000);
}
</script>
</body>
</html>
